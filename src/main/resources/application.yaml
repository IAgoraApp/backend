spring:
  application:
    name: backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/IAgora}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

server:
  port: ${PORT:8080}

springdoc:
  swagger-ui:
    path: /api/docs

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

security:
  jwt:
    enabled: true
